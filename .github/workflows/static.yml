// Consultation Form Section
function ConsultationFormSection() {
  const [formData, setFormData] = useState({
    name: '',
    phone: '',
    spaceType: '2BHK',
    budget: '10L-20L',
    notes: ''
  });
  const [isSubmitting, setIsSubmitting] = useState(false);
  const [submitStatus, setSubmitStatus] = useState<{ success: boolean; message: string } | null>(null);

  const handleChange = (e: React.ChangeEvent<HTMLInputElement | HTMLTextAreaElement | HTMLSelectElement>) => {
    const { name, value } = e.target;
    setFormData(prev => ({ ...prev, [name]: value }));
  };

  const handleSubmit = (e: React.FormEvent) => {
    e.preventDefault();
    setIsSubmitting(true);
    
    // Validate form
    if (!formData.name.trim() || !formData.phone.trim()) {
      setSubmitStatus({ success: false, message: 'Please fill in all required fields.' });
      setIsSubmitting(false);
      return;
    }

    // Simulate form submission
    setTimeout(() => {
      setIsSubmitting(false);
      setSubmitStatus({ 
        success: true, 
        message: 'Thank you! Redirecting to WhatsApp...' 
      });
      
      // Redirect to WhatsApp after 2 seconds
      setTimeout(() => {
        const message = `Hi Sourav, I am ${formData.name}. Phone: ${formData.phone}. Space Type: ${formData.spaceType}. Budget: ${formData.budget}. Notes: ${formData.notes}`;
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`, '_blank');
      }, 2000);
    }, 1500);
  };

  const spaceTypes = ['2BHK', '3BHK', 'Villa', 'Office', 'Apartment', 'Commercial Space'];
  const budgetRanges = ['10L-20L', '20L-30L', '30L-50L', '50L+'];

  return (
    <section id="contact" className="py-20 bg-alabaster">
      <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <div className="grid lg:grid-cols-2 gap-12 items-center">
