                type="submit"
                disabled={isSubmitting}
                className="w-full bg-slate-dark text-white py-4 rounded-xl font-medium hover:bg-charcoal transition-all disabled:opacity-70 disabled:cursor-not-allowed flex items-center justify-center gap-2"
