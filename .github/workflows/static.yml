                />
              </div>
              
              <div>
                <label className="block text-sm font-medium text-slate-dark mb-2">Space Type</label>
                <select
                  name="spaceType"
                  value={formData.spaceType}
                  onChange={handleChange}
                  className="w-full px-4 py-3 rounded-xl border border-warm-gray/30 focus:border-taupe focus:outline-none transition-all bg-light-cream"
                >
                  {spaceTypes.map(type => (
                    <option key={type} value={type}>{type}</option>
                  ))}
                </select>
              </div>
              
              <div>
                <label className="block text-sm font-medium text-slate-dark mb-2">Estimated Budget</label>
                <select
                  name="budget"
                  value={formData.budget}
                  onChange={handleChange}
                  className="w-full px-4 py-3 rounded-xl border border-warm-gray/30 focus:border-taupe focus:outline-none transition-all bg-light-cream"
                >
                  {budgetRanges.map(range => (
                    <option key={range} value={range}>₹{range}</option>
                  ))}
