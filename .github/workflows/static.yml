              </div>
              
              <div>
                <label className="block text-sm font-medium text-slate-dark mb-2">Additional Notes</label>
                <textarea
                  name="notes"
                  value={formData.notes}
                  onChange={handleChange}
                  placeholder="Any specific requirements or preferences..."
